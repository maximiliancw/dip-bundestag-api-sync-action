name: dip-bundestag-api-sync-action
description: Sync dip-bundestag-api repository with remote OpenAPI specification file based on ETag HTTP header
runs:
  using: "composite"
  steps:
    - name: Get ETag from remote resource
      id: get_remote_etag
      shell: bash
      run: |
        value=$(curl -sI https://search.dip.bundestag.de/api/v1/swagger-ui/ | awk 'BEGIN{IGNORECASE=1} /^etag:/ {gsub(/^[^:]*:[ \t]*/, ""); gsub(/["\r\n]/, ""); print $0}')
        if [ -z "$value" ]; then
          echo "Error: Could not retrieve ETag from https://search.dip.bundestag.de/api/v1/swagger-ui/"
          exit 1
        fi
        echo "value=$value" >> $GITHUB_OUTPUT

    - name: Use cache
      id: use_cache
      uses: actions/cache@v4
      with:
          path: openapi.yaml
          key: ${{ steps.get_remote_etag.outputs.value }}
      
    - name: "Sync OpenAPI specs"
      shell: bash
      if: steps.use_cache.outputs.cache-hit != 'true'
      run: |
        if ! curl -f -s https://search.dip.bundestag.de/api/v1/openapi.yaml > openapi.yaml; then
          echo "Error: Failed to download OpenAPI spec from https://search.dip.bundestag.de/api/v1/openapi.yaml"
          exit 1
        fi
        echo "Successfully downloaded OpenAPI spec to openapi.yaml"
